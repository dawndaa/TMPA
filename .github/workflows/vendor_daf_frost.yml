name: Vendor DAF frost assets

on:
  push:
    branches:
      - feature/ctta-daf-integration

permissions:
  contents: write

jobs:
  vendor-frost:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ctta-daf-integration
          fetch-depth: 0

      - name: Download original DAF frost assets
        shell: bash
        run: |
          set -euo pipefail
          dst='ctta/vendor/daf_imagecorruptions/frost'
          mkdir -p "$dst"
          base='https://raw.githubusercontent.com/dawndaa/DAF/main/utils/imagecorruptions/frost'
          curl -L --fail "$base/frost1.png" -o "$dst/frost1.png"
          curl -L --fail "$base/frost2.png" -o "$dst/frost2.png"
          curl -L --fail "$base/frost3.png" -o "$dst/frost3.png"
          curl -L --fail "$base/frost4.jpg" -o "$dst/frost4.jpg"
          curl -L --fail "$base/frost5.jpg" -o "$dst/frost5.jpg"
          curl -L --fail "$base/frost6.jpg" -o "$dst/frost6.jpg"

          test "$(git hash-object "$dst/frost1.png")" = 'c7b78a17938df51894497b4782decbd82532dd5f'
          test "$(git hash-object "$dst/frost2.png")" = '48f7a861ffa41b6d7496b701fef96d5edf739282'
          test "$(git hash-object "$dst/frost3.png")" = 'd47f9d25f41251ee9a66b294c0bbfad6053017c9'
          test "$(git hash-object "$dst/frost4.jpg")" = 'f8b0c413176d70150b593e029d84b4a88c21dd4b'
          test "$(git hash-object "$dst/frost5.jpg")" = '95dc9056926d8201df760535f9bb9112f012e862'
          test "$(git hash-object "$dst/frost6.jpg")" = '14e5d58e762a5d0808df9fa6494fd6d78ee4409b'

      - name: Commit assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/vendor_daf_frost.yml
          git add ctta/vendor/daf_imagecorruptions/frost .github/workflows/vendor_daf_frost.yml
          git commit -m 'Vendor original DAF frost assets'
          git push origin HEAD:feature/ctta-daf-integration
